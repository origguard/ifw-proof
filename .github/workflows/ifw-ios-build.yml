name: IFW iOS Headless Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag de release'
        required: false
        default: 'v1.0.0'

jobs:
  build-unsigned-ios:
    name: Build Unsigned iOS IPA (macos-14)
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install NPM dependencies (reproducible npm ci)
        run: |
          npm ci

      - name: 4. Build web assets & sync Capacitor
        run: |
          npm run build --if-present
          npx cap sync ios

      - name: 5. Lint PrivacyInfo.xcprivacy (Rail B Syntax Check)
        run: |
          set -euo pipefail
          echo "Vérification syntaxique Apple du Privacy Manifest..."
          plutil -lint ios/App/App/PrivacyInfo.xcprivacy

      - name: 6. Resolve CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios/App
          pod repo update || true
          pod install --repo-update
          cd ../..

      - name: 7. Build unsigned iOS app via xcodebuild
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/App/build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build -quiet

      - name: 8. Package unsigned IPA container
        run: |
          set -euo pipefail
          APP_PATH="ios/App/build/DerivedData/Build/Products/Release-iphoneos/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: App.app non trouvé à $APP_PATH"
            find ios/App/build/DerivedData -maxdepth 6 -type d -name "*.app" || true
            exit 1
          fi

          echo "App.app localisé avec succès : $APP_PATH"
          mkdir -p build/output/Payload
          cp -R "$APP_PATH" build/output/Payload/App.app

          # Injection directe du Privacy Manifest dans le bundle racine
          if [ -f "ios/App/App/PrivacyInfo.xcprivacy" ]; then
            cp ios/App/App/PrivacyInfo.xcprivacy build/output/Payload/App.app/PrivacyInfo.xcprivacy
            echo "PrivacyInfo.xcprivacy copié dans Payload/App.app/"
          elif [ -f "ios-manifests/PrivacyInfo.xcprivacy" ]; then
            cp ios-manifests/PrivacyInfo.xcprivacy build/output/Payload/App.app/PrivacyInfo.xcprivacy
            echo "PrivacyInfo.xcprivacy copié depuis ios-manifests dans Payload/App.app/"
          fi

          cd build/output
          zip -r ../IFW-Proof-unsigned.ipa Payload
          cd ../..
          echo "Archive IPA non signée produite : build/IFW-Proof-unsigned.ipa"
          ls -lh build/IFW-Proof-unsigned.ipa

      - name: 9. Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IFW-Proof-unsigned-ipa
          path: build/IFW-Proof-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
